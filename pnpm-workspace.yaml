allowBuilds:
  core-js: true
  core-js-pure: true

# Force patched transitive deps under react-scripts (CRA is unmaintained).
# Left alone (major break risk, moderate/dev-only): webpack-dev-server@5, uuid@11.
overrides:
  '@babel/core': ^7.29.1
  '@babel/plugin-transform-modules-systemjs': ^7.29.4
  body-parser: ^1.20.6
  'brace-expansion@<2': 1.1.18
  'brace-expansion@>=2': 2.1.4
  fast-uri: ^3.1.5
  flatted: ^3.4.2
  follow-redirects: ^1.15.12
  'form-data@>=3': ^3.0.5
  http-proxy-middleware: ^2.0.10
  'js-yaml@<4': ^3.15.0
  'js-yaml@>=4': ^4.3.0
  launch-editor: ^2.14.1
  lodash: ^4.17.24
  node-forge: ^1.4.0
  nth-check: ^2.0.1
  'path-to-regexp@<1': 0.1.13
  'picomatch@<3': ^2.3.2
  'picomatch@>=4': ^4.0.4
  postcss: ^8.5.23
  qs: ^6.15.2
  serialize-javascript: ^7.0.5
  shell-quote: ^1.8.5
  svgo: ^2.8.3
  underscore: ^1.13.8
  '@tootallnate/once': ^2.0.1
  websocket-driver: ^0.7.5
  'ws@<8': ^7.5.11
  'ws@>=8': ^8.21.0
  'yaml@<2': ^1.10.3
  'yaml@>=2': ^2.8.3
